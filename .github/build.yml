# ============================================================
#  Build ISS Weighbridge .exe on GitHub
#
#  Runs on a Windows runner, injects your PUBLIC key, builds the installer
#  with electron-builder, and attaches it to a GitHub Release.
#
#  WHAT GITHUB NEEDS (and what it must NEVER have)
#  GitHub only ever needs your PUBLIC key. The private key
#  (iss-private.pem) stays on your PC for issuing licences and is NEVER
#  uploaded anywhere. That is the whole point of asymmetric signing: the
#  builder can embed the public half in the app without being able to
#  forge a single licence.
#
#  SET THIS UP ONCE
#  In your GitHub repo:  Settings → Secrets and variables → Actions →
#  New repository secret
#    Name:  ISS_PUBLIC_KEY
#    Value: the full PUBLIC key block iss-genkeys.js printed, e.g.
#           -----BEGIN PUBLIC KEY-----
#           MCowBQ...
#           -----END PUBLIC KEY-----
#
#  Optionally also add (only if you use call-home):
#    ISS_CALLHOME_ENDPOINT   and   ISS_CALLHOME_KEY
#
#  HOW TO TRIGGER A BUILD
#    Option A — publish a Release in GitHub (tag it e.g. v9.9.4).
#    Option B — Actions tab → this workflow → "Run workflow".
# ============================================================
name: Build Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Inject the PUBLIC key from the secret into license.js, replacing the
      # placeholder. The private key is never involved here.
      - name: Inject public key
        shell: pwsh
        run: |
          $pub = $env:ISS_PUBLIC_KEY
          if ([string]::IsNullOrWhiteSpace($pub)) {
            Write-Error "Secret ISS_PUBLIC_KEY is not set. Add it under Settings -> Secrets -> Actions."
            exit 1
          }
          $path = "electron/license.js"
          $src  = Get-Content $path -Raw
          $block = "const PUBLIC_KEY_PEM = `"+'`'+"$pub"+'`'+"`;"
          # Replace the whole PUBLIC_KEY_PEM = `...`; assignment
          $pattern = "const PUBLIC_KEY_PEM = ``[\s\S]*?``;"
          $out = [System.Text.RegularExpressions.Regex]::Replace($src, $pattern, $block)
          if ($out -eq $src) { Write-Error "Could not find PUBLIC_KEY_PEM to replace in $path"; exit 1 }
          Set-Content $path $out -NoNewline
          Write-Host "Public key injected."
        env:
          ISS_PUBLIC_KEY: ${{ secrets.ISS_PUBLIC_KEY }}

      # Optional: wire call-home only if both secrets exist. Skipped silently
      # otherwise, so the build works with or without them.
      # NOTE: `secrets` cannot be used in a step-level `if:` (GitHub rejects the
      # file with "Unrecognized named-value: 'secrets'"). So the secrets are
      # passed into env vars and the presence check is done inside the script.
      - name: Inject call-home endpoint (optional)
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EP) -or [string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Host "Call-home secrets not set — skipping (app ships with call-home off)."
            exit 0
          }
          $path = "electron/callhome.js"
          $src  = Get-Content $path -Raw
          $src  = $src -replace "const ENDPOINT = '';", "const ENDPOINT = '$($env:EP)';"
          $src  = $src -replace "const ANON_KEY = '';", "const ANON_KEY = '$($env:KEY)';"
          Set-Content $path $src -NoNewline
          Write-Host "Call-home configured."
        env:
          EP:  ${{ secrets.ISS_CALLHOME_ENDPOINT }}
          KEY: ${{ secrets.ISS_CALLHOME_KEY }}

      # npm ci is faster and reproducible but REQUIRES package-lock.json in the
      # repo. Fall back to npm install if you haven't committed a lockfile.
      # (Committing the lockfile is recommended — it pins exact dependency
      # versions so a build in six months matches one today.)
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") { npm ci } else { npm install }

      - name: Build installer
        run: npm run dist

      # Keep the .exe as a downloadable artifact on the workflow run.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISS-Weighbridge-Setup
          path: dist/*.exe

      # If this run was triggered by publishing a Release, attach the .exe to it.
      - name: Attach installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
