name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Build installer (no publish)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided automatically; silences the token warning

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ISS-Weighbridge-Setup-${{ steps.pkg.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90
